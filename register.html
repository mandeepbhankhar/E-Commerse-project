
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ShopSphere</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: linear-gradient(135deg, #eee7fa, #faf9ff);
        }
        .auth-box {
            background: white; width: min(420px, 92%); padding: 35px;
            border-radius: 18px; box-shadow: 0 10px 35px #30204f18;
        }
        h1 { color: #30204f; text-align: center; }
        h1 span { color: #8050c8; }
        p { color: #777; text-align: center; }
        label { display: block; margin: 16px 0 7px; color: #30204f; }
        input {
            width: 100%; padding: 13px; border: 1px solid #ddd;
            border-radius: 7px; outline-color: #8050c8;
        }
        button {
            width: 100%; margin-top: 22px; padding: 14px;
            background: #8050c8; color: white; border: 0;
            border-radius: 7px; font-size: 16px; cursor: pointer;
        }
        .message { color: #c0392b; text-align: center; }
        .bottom { margin-top: 20px; }
        a { color: #8050c8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>Shop<span>Sphere</span></h1>
        <p>Create your shopping account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="At least 6 characters" minlength="6" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom">Already have an account? <a href="/login">Login</a></p>
        <p><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
